<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat Client</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
      }
      label {
        display: inline-block;
        width: 120px;
      }
      input[type="text"] {
        width: 300px;
      }
      #logs {
        border: 1px solid #ccc;
        height: 240px;
        overflow: auto;
        padding: 8px;
        margin-top: 8px;
        background: #fafafa;
      }
      .row {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h2>Chat Client (test)</h2>

    <div class="row">
      <label>Token:</label>
      <input id="token" type="text" placeholder="JWT token" />
      <button onclick="client.connect(document.getElementById('token').value)">
        Connect
      </button>
    </div>

    <div class="row">
      <label>Open conv with (otherUserId):</label>
      <input id="otherUserId" type="text" placeholder="other user id" />
      <button
        onclick="client.openConversation(document.getElementById('otherUserId').value)"
      >
        Open Conversation
      </button>
    </div>

    <div class="row">
      <label>Conversation ID (join):</label>
      <input id="conversationId" type="text" />
      <button
        onclick="client.joinConversation(document.getElementById('conversationId').value)"
      >
        Join
      </button>
    </div>

    <div class="row">
      <label>Receiver ID:</label>
      <input id="receiverId" type="text" />
    </div>

    <div class="row">
      <label>Message:</label>
      <input id="message" type="text" />
      <button
        onclick="client.sendMessage({ text: document.getElementById('message').value, receiverId: document.getElementById('receiverId').value })"
      >
        Send
      </button>
    </div>

    <div class="row">
      <label>Message ID (mark seen):</label>
      <input id="messageId" type="text" placeholder="optional" />
      <button
        onclick="client.markSeen(document.getElementById('messageId').value)"
      >
        Mark Seen
      </button>
    </div>

    <h3>Logs</h3>
    <div id="logs"></div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script src="./chat-client.js"></script>
    <script>
      const client = new ChatClient({
        serverUrl: "http://localhost:5000", // socket server
        logElementId: "logs",
      });
    </script>
  </body>
</html>
